name: E2E Tests

on:
  push:
    branches: [edge, stable, feature/eid-oidc-poc]
  pull_request:
    branches:
      - edge
      - stable
      - "jc/**"
  # Manual trigger: lets repo write-access users run CI on any branch
  # (including spr/edge/* stack branches, which `pull_request` no longer
  # auto-triggers for). UI: Actions → E2E Tests → "Run workflow".
  # CLI: `gh workflow run "E2E Tests" --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: polis-e2e-${{ github.run_id }}

    steps:
      - name: 1. Free up disk space on runner
        run: |
          echo "Starting disk cleanup..."
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell
          echo "Disk space after cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install mkcert
        run: |
          # Install mkcert for certificate generation
          curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
          chmod +x mkcert-v*-linux-amd64
          sudo cp mkcert-v*-linux-amd64 /usr/local/bin/mkcert

          # Install CA in system trust store
          mkcert -install

      - name: Generate certificates
        run: |
          # Create certificate directory in workspace (not home directory)
          mkdir -p ./.simulacrum/certs
          cd ./.simulacrum/certs

          # Generate certificates for all required hostnames
          mkcert -cert-file localhost.pem -key-file localhost-key.pem \
            localhost 127.0.0.1 ::1 oidc-simulator host.docker.internal

          # Copy mkcert root CA for other containers
          cp "$(mkcert -CAROOT)/rootCA.pem" ./rootCA.pem

          # List generated files for debugging
          echo "Generated certificates:"
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test.env with CI-specific paths
        run: |
          # Update AUTH_CERTS_PATH to use workspace-relative path
          sed -i 's|AUTH_CERTS_PATH=.*|AUTH_CERTS_PATH=./.simulacrum/certs|' test.env

          # Copy test.env to .env for docker-compose variable interpolation
          cp test.env .env

      - name: Build and start E2E services
        run: |
          # Build postgres with --no-cache to ensure latest migrations are used
          # Docker layer caching can cause old migration files to persist
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml \
            --env-file test.env build --no-cache postgres

          # These services cover the complete Cypress suite without building Delphi.
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml \
            --env-file test.env up -d --build \
            nginx-proxy file-server math ses-local

          # Show running containers
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml ps

      - name: Wait for PostgreSQL and OIDC
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml \
              exec -T postgres pg_isready -U postgres; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become ready"
              exit 1
            fi
            sleep 5
          done

          curl --retry 30 --retry-connrefused --retry-delay 2 -k -f \
            https://localhost:3000/.well-known/jwks.json >/dev/null

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:PdwPNS2mDN73Vfbc@localhost:5432/polis-test
          POSTGRES_DB: polis-test
          POSTGRES_HOST: postgres:5432
          POSTGRES_PASSWORD: PdwPNS2mDN73Vfbc
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        run: |
          echo "Installing postgres-client..."
          sudo apt-get update && sudo apt-get install -y postgresql-client

          echo "Making migration script executable..."
          chmod +x server/bin/run-migrations.sh

          echo "Running migrations..."
          ./server/bin/run-migrations.sh

      - name: Check server API
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              http://localhost/api/v3/participationInit || true)
            if [[ "$status" == "200" || "$status" == "401" || "$status" == "403" ]]; then
              echo "Server API is responding with HTTP $status"
              exit 0
            fi
            sleep 5
          done
          echo "Server API did not become ready"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml logs server
          exit 1

      - name: Show postgres initialization logs
        if: always()
        run: |
          echo "=== Postgres container logs (shows migration execution) ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml logs postgres | head -200

      - name: Show service logs
        if: always()
        run: |
          # Show logs from critical services for debugging
          echo "=== NGINX Proxy logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml logs nginx-proxy || true

          echo "=== OIDC Simulator logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml logs oidc-simulator || true

          echo "=== Server logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml logs server || true

      - name: Install Cypress dependencies
        run: npm ci
        working-directory: e2e

      - name: Run auth setup test
        run: |
          cd e2e

          # Copy test.env to e2e directory for Cypress to read
          cp ../test.env .env

          # Update AUTH_CERTS_PATH to be relative to e2e directory
          sed -i 's|AUTH_CERTS_PATH=.*|AUTH_CERTS_PATH=../.simulacrum/certs|' .env

          # Set environment variables for the test script
          export AUTH_CERTS_PATH=../.simulacrum/certs
          export CYPRESS_BASE_URL=http://localhost
          export AUTH_ISSUER=https://localhost:3000/

          # Run the validation script
          node test-auth-setup.js

      - name: Run Cypress E2E tests
        run: |
          cd e2e

          # Set environment variables for Cypress
          export NODE_EXTRA_CA_CERTS=$(pwd)/../.simulacrum/certs/rootCA.pem
          export CYPRESS_BASE_URL=http://localhost
          export AUTH_ISSUER=https://localhost:3000/
          export AUTH_CERTS_PATH=$(pwd)/../.simulacrum/certs

          # Run all Cypress tests
          npm test

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: e2e/cypress/videos
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.test.yml down -v
